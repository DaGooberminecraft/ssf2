<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SSF2</title>

    <script src="ruffle/ruffle.js"></script>

    <style>
        body {
            margin: 0;
            background: black;
        }
        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
<div id="game"></div>

<script>
window.addEventListener("load", () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    document.getElementById("game").appendChild(player);

    player.load("SSF2Portable.swf");
});
</script>

</body>
</html>
